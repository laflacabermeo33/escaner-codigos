<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light dark">
<title>Escáner de códigos</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --txt:#1d2330; --muted:#6b7280; --acc:#2563eb; --ok:#16a34a; --err:#dc2626; --line:#d7dbe3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1218; --card:#1a1f2a; --txt:#e8ebf1; --muted:#9aa3b2; --acc:#4f8cff; --ok:#22c55e; --err:#f87171; --line:#2e3646; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; overflow-x:hidden; width:100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--txt); }
  main { max-width: 520px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  button { font: inherit; border:0; border-radius:12px; padding:14px 16px; font-size:16px; font-weight:600; cursor:pointer; width:100%; }
  .btn-main { background:var(--acc); color:#fff; }
  .btn-save { background:var(--ok); color:#fff; margin-top:6px; }
  button:disabled { opacity:.55; cursor:default; }
  label { display:block; font-size:14px; color:var(--muted); margin: 10px 0 4px; }
  input, textarea { width:100%; font: inherit; font-size:17px; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--txt); }
  textarea { min-height:70px; resize:vertical; }
  .seg { display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
  .seg input[type=radio] { display:none; }
  .seg label.opt { margin:0; padding:14px; text-align:center; border:2px solid var(--line); border-radius:12px; color:var(--txt); font-size:16px; font-weight:600; cursor:pointer; }
  .seg input:checked + label.opt { border-color:var(--acc); background:rgba(37,99,235,.12); color:var(--acc); }
  #msg { margin-top:10px; padding:12px; border-radius:10px; display:none; font-size:15px; }
  #msg.ok { display:block; background:rgba(22,163,74,.15); color:var(--ok); }
  #msg.err { display:block; background:rgba(220,38,38,.12); color:var(--err); }
  #msg.info { display:block; background:rgba(37,99,235,.12); color:var(--acc); }
  .hint { font-size:13px; color:var(--muted); margin:8px 0 0; }

  /* Cámara a pantalla completa */
  #cam-overlay { position:fixed; inset:0; background:#000; z-index:1000; display:none; }
  #cam-overlay.open { display:block; }
  #cam { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #guide { position:absolute; left:6%; right:6%; top:34%; height:32%; border:3px solid #22c55e; border-radius:12px; box-shadow:0 0 0 9999px rgba(0,0,0,.35); pointer-events:none; }
  #cam-status { position:absolute; left:0; right:0; top:calc(env(safe-area-inset-top) + 16px); text-align:center; color:#fff; font-size:17px; font-weight:600; text-shadow:0 1px 4px #000; padding:0 16px; }
  #cam-bottom { position:absolute; left:0; right:0; bottom:0; padding:16px; padding-bottom:calc(env(safe-area-inset-bottom) + 16px); background:linear-gradient(transparent, rgba(0,0,0,.7)); }
  #btn-close { background:#fff; color:#111; }
</style>
</head>
<body>

<div id="cam-overlay" aria-hidden="true">
  <video id="cam" playsinline muted autoplay></video>
  <div id="guide"></div>
  <div id="cam-status">Apunta al código dentro del recuadro</div>
  <div id="cam-bottom"><button id="btn-close" type="button">Cerrar cámara</button></div>
</div>

<main>
  <h1>Escáner de códigos</h1>

  <div class="card">
    <button id="btn-cam" class="btn-main" type="button">Abrir cámara y escanear</button>
    <p class="hint">Se abre la cámara a pantalla completa. Apunta al código de barras o Code 128. El navegador pedirá permiso de cámara.</p>
  </div>

  <form id="form" class="card" autocomplete="off">
    <label>Tipo</label>
    <div class="seg">
      <input type="radio" name="tipo" id="t-bodega" value="Bodega" checked>
      <label class="opt" for="t-bodega">Bodega</label>
      <input type="radio" name="tipo" id="t-medidor" value="Medidor">
      <label class="opt" for="t-medidor">Medidor</label>
    </div>

    <label for="codigo">Código</label>
    <input id="codigo" name="codigo" type="text" placeholder="Escanea o escribe">

    <label for="formato">Formato detectado</label>
    <input id="formato" name="formato" type="text" readonly placeholder="—">

    <label for="cantidad">Cantidad o lectura</label>
    <input id="cantidad" name="cantidad" type="text" inputmode="decimal" placeholder="Ej: 12 o 1543.7">

    <label for="usuario">Usuario</label>
    <input id="usuario" name="usuario" type="text" placeholder="Tu nombre">

    <label for="notas">Notas</label>
    <textarea id="notas" name="notas" placeholder="Opcional"></textarea>

    <button type="submit" id="btn-save" class="btn-save">Guardar</button>
    <div id="msg"></div>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
  // ======= CONFIGURACIÓN =======
  var URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbyB9LXDFEJfl-ppHvGm6UGf3TSmaPLYFh_fIU-djggi19JRlFafEJgU3AAe6WHesyxv/exec';
  var TOKEN = 'esc-TK-7fQ2pW9xLm4RvB8sN3kZ';
  var HOJA = 'Escaneos';
  // =============================

  var $ = function (id) { return document.getElementById(id); };
  var reader = null;
  var stream = null;

  function msg(texto, tipo) {
    var m = $('msg');
    m.textContent = texto;
    m.className = tipo || '';
  }

  function estado(texto) { $('cam-status').textContent = texto; }

  function beep() {
    try { if (navigator.vibrate) navigator.vibrate(120); } catch (e) {}
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      var ctx = new AC();
      var o = ctx.createOscillator(); var g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.frequency.value = 1400; g.gain.value = 0.15;
      o.start(); setTimeout(function () { o.stop(); ctx.close(); }, 120);
    } catch (e) {}
  }

  function cerrarCamara() {
    try { if (reader) { reader.reset(); } } catch (e) {}
    reader = null;
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    var v = $('cam'); v.srcObject = null;
    $('cam-overlay').classList.remove('open');
    $('cam-overlay').setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  function abrirCamara() {
    if (typeof ZXing === 'undefined') {
      msg('No se pudo cargar el lector de códigos. Revisa tu conexión y recarga la página.', 'err');
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      msg('Este navegador no permite usar la cámara aquí. Abre la página con HTTPS o escribe el código a mano.', 'err');
      return;
    }

    $('cam-overlay').classList.add('open');
    $('cam-overlay').setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    estado('Abriendo cámara…');

    navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      }
    }).then(function (s) {
      stream = s;
      var v = $('cam');
      v.setAttribute('playsinline', '');
      v.muted = true;
      v.srcObject = s;
      return v.play().then(function () { return v; });
    }).then(function (v) {
      var formatos = [
        ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39, ZXing.BarcodeFormat.CODE_93,
        ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A,
        ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.QR_CODE,
        ZXing.BarcodeFormat.DATA_MATRIX
      ];
      var hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formatos);
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      reader = new ZXing.BrowserMultiFormatReader(hints, 200);
      estado('Apunta al código dentro del recuadro');

      reader.decodeFromVideoElement(v, function (result, err) {
        if (result) {
          $('codigo').value = result.getText();
          $('formato').value = String(result.getBarcodeFormat()).replace(/_/g, ' ');
          beep();
          msg('Código leído. Completa los datos y pulsa Guardar.', 'ok');
          cerrarCamara();
        }
      });
    }).catch(function (e) {
      cerrarCamara();
      var permiso = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
      msg(permiso
        ? 'Permiso de cámara denegado. Actívalo en los ajustes del navegador y vuelve a intentarlo.'
        : 'No se pudo abrir la cámara. Escribe el código a mano.', 'err');
    });
  }

  $('btn-cam').addEventListener('click', abrirCamara);
  $('btn-close').addEventListener('click', cerrarCamara);

  $('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var codigo = $('codigo').value.trim();
    if (!codigo) { msg('Escribe o escanea un código antes de guardar.', 'err'); return; }

    var tipo = document.querySelector('input[name="tipo"]:checked').value;
    var datos = {
      token: TOKEN,
      hoja: HOJA,
      fecha: new Date().toISOString(),
      tipo: tipo,
      codigo: codigo,
      formato: $('formato').value || 'manual',
      cantidad: $('cantidad').value.trim(),
      usuario: $('usuario').value.trim(),
      notas: $('notas').value.trim()
    };

    var btn = $('btn-save');
    btn.disabled = true; btn.textContent = 'Guardando…';
    msg('Enviando…', 'info');

    fetch(URL_APPS_SCRIPT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(datos)
    })
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (res && res.ok) {
        msg('Guardado en la hoja (fila ' + res.fila + ').', 'ok');
        limpiarCampos();
      } else {
        msg('El servidor rechazó el envío: ' + ((res && res.error) || 'error desconocido'), 'err');
      }
    })
    .catch(function () {
      // Si el navegador bloquea la respuesta, el envío sí puede haber llegado.
      return fetch(URL_APPS_SCRIPT, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(datos)
      }).then(function () {
        msg('Enviado. No se pudo confirmar la respuesta; revisa la hoja.', 'info');
        limpiarCampos();
      }).catch(function () {
        msg('No se pudo enviar. Revisa tu conexión e inténtalo de nuevo.', 'err');
      });
    })
    .then(function () { btn.disabled = false; btn.textContent = 'Guardar'; });
  });

  function limpiarCampos() {
    $('codigo').value = '';
    $('formato').value = '';
    $('cantidad').value = '';
    $('notas').value = '';
  }
</script>
</body>
</html>
